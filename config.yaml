# ========================================================
# SuperNova Configuration File (Auto-generated Template)
# ========================================================

# --------------------------------------------------------
# Section: [storage]
# --------------------------------------------------------
storage:
  # Base directory for storage
  base_dir: ./workspace
  # Subdirectory or prefix for session entities
  session_dir: sessions
  # Subdirectory name for agent workspaces and trajectories
  agent_dir: agents
  # Subdirectory name for offloaded large payload blobs
  blob_dir: blobs
  # Subdirectory name for episodic daily summaries
  summary_dir: summaries
  # Filename for agent trajectory jsonl log
  history_file: history.jsonl
  # Subdirectory name for agent profile configurations
  profile_dir: profiles
  # Default version folder for agent profiles
  profile_version: self

# --------------------------------------------------------
# Section: [agent]
# --------------------------------------------------------
agent:
  # Maximum historical message window size in memory
  max_context_window: 50
  # Number of recent messages to keep uncompressed
  uncompressed_tail: 4
  # Enable compact token-saving formatting for older history
  save_tokens: true
  # Safety cap for maximum history lines to read from disk
  max_history_lines_safety_cap: 500
  # Enable automatic offloading of large payloads to blob storage
  enable_payload_offload: true
  # Threshold in characters for new incoming messages to offload to blob
  offload_threshold_new_message: 1000
  # Strict threshold in characters for older compacted history to offload to blob
  offload_threshold_compact: 1000
  # Character length of preview text in DataPointer markers
  preview_length: 100
  # Inject temporal gap markers between long dialogue pauses
  enable_temporal_injection: true
  # Time threshold in milliseconds to trigger temporal marker (default 5 min)
  temporal_threshold_ms: 60000
  # Queue count threshold to wake up agent on low-priority messages
  force_wakeup_threshold: 5
  # Number of recent days to retrieve for episodic memory summaries
  memory_episodic_days: 3

# --------------------------------------------------------
# Section: [llm]
# --------------------------------------------------------
llm:
  default_preset: DEFAULT
  embedding_model: text-embedding-3-small
  embedding_provider: openai
  presets:
    DEFAULT:
      provider: openai
      modelName: gpt-5.6-luna
      temperature: 1
      maxTokens: 8192
      reasoning:
        effort: low
        summary: auto
      parallel_tool_calls: true
      service_tier: flex
    REASONING_FAST:
      provider: openai
      modelName: gpt-5.6-luna
      temperature: 1
      maxTokens: 8192
      reasoning:
        effort: low
        summary: auto
      parallel_tool_calls: true
      service_tier: flex
    FAST:
      provider: openai
      modelName: gpt-4o-mini
      temperature: 0.2
      maxTokens: 4096
      parallel_tool_calls: true
    CHEAP:
      provider: openai
      modelName: gpt-5.6-luna
      temperature: 0.2
      maxTokens: 4096
      service_tier: flex
      parallel_tool_calls: true
    EXTRACTION:
      provider: openai
      modelName: gpt-5.6-luna
      temperature: 0.1
      maxTokens: 8192
      reasoning:
        effort: none
      parallel_tool_calls: true
      service_tier: flex
    default:
      provider: openai
      modelName: gpt-5.6-luna
      temperature: 1
      maxTokens: 8192
      reasoning:
        effort: low
        summary: auto
      parallel_tool_calls: true
      service_tier: flex

